<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Programa de fidelidade Fideliza+." />
    <style>
      /*
       * Fundo fixo no CSS (não no JS): assim já é o que o navegador pinta no
       * primeiro frame possível, sem depender de nenhum script rodar antes -
       * a única fonte de "flash de branco" que o código consegue controlar.
       */
      #app-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        background: %VITE_EMPRESA_SPLASH_BG%;
        transition: opacity 0.25s ease;
      }
      #app-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      /*
       * App do cliente (/app): pré-pinta a identidade visual da padaria salva
       * na última visita, ANTES de o React montar. Sem isto a tela abre no
       * verde padrão e "pisca" para a cor configurada quando a API responde.
       */
      (function () {
        try {
          window.__fidelidadeTema = null;
          if (!location.pathname.startsWith('/app')) return;
          // A aba do navegador no app do cliente usa a logo da padaria, não o
          // ícone genérico do Fideliza+ (esse continua servindo o painel em /).
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = '%VITE_EMPRESA_LOGO_URL%';
            favicon.removeAttribute('type');
          }
          var t = JSON.parse(localStorage.getItem('fidelidade_cliente_tema') || 'null');
          window.__fidelidadeTema = t;
          if (!t) return;
          var s = document.documentElement.style;
          if (t.brand) s.setProperty('--brand', t.brand);
          if (t.contrast) s.setProperty('--brand-contrast', t.contrast);
          if (t.brand2) s.setProperty('--brand-2', t.brand2);
          if (t.canvas) s.setProperty('--color-canvas', t.canvas);
          if (t.brand) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t.brand);
          }
        } catch (e) {}
      })();
    </script>
    <!-- App do cliente (PWA) no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meus Pontos" />
    <link rel="apple-touch-icon" href="%VITE_EMPRESA_LOGO_URL%" />
    <title>Fideliza+</title>
  </head>
  <body>
    <div id="app-splash"><img id="app-splash-logo" alt="" /></div>
    <script>
      // Roda antes do bundle React (script deferred/module) — cobre o
      // intervalo entre o HTML pintar e o React montar de verdade. O fundo
      // já vem do CSS acima (fixo); aqui só falta mostrar e pôr a logo.
      (function () {
        try {
          if (!location.pathname.startsWith('/app')) return;
          var t = window.__fidelidadeTema;
          var splash = document.getElementById('app-splash');
          var logo = document.getElementById('app-splash-logo');
          logo.src = (t && t.logo) || '%VITE_EMPRESA_LOGO_URL%';
          splash.style.display = 'flex';
          window.__splashShownAt = Date.now();
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
