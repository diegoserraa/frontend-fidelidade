<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Preto fixo de propósito, nunca trocado por JS: o Android tira uma
         "foto" dessa cor só na instalação e nunca mais atualiza — se fosse
         dinâmica por padaria, ficaria travada na cor de quem instalou. -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Programa de fidelidade Fideliza+." />
    <style>
      /*
       * Fundo fixo no CSS (não no JS): assim já é o que o navegador pinta no
       * primeiro frame possível, sem depender de nenhum script rodar antes -
       * a única fonte de "flash de branco" que o código consegue controlar.
       */
      #app-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* --splash-bg/--splash-bg-2 vêm do cache da padaria (script abaixo)
           — cor primária e secundária, que toda padaria configura. Um
           gradiente diagonal entre as duas ocupa a tela toda com a marca de
           verdade, sem precisar de nenhum arquivo de imagem novo (as duas
           cores já existem). Sem cache ainda, os dois lados do gradiente
           caem no mesmo valor fixo (neutro) — vira um sólido, combinando
           com os pontinhos de carregamento. */
        background: linear-gradient(
          160deg,
          var(--splash-bg, %VITE_EMPRESA_SPLASH_BG%) 0%,
          var(--splash-bg-2, var(--splash-bg, %VITE_EMPRESA_SPLASH_BG%)) 100%
        );
        transition: opacity 0.25s ease;
      }
      /* Loading "de app premium": um anel fino girando, sem depender de
         nenhuma imagem/logo — funciona igual desde o primeiro pixel, nunca
         corre o risco de mostrar a marca errada, e sempre combina com o
         gradiente porque é branco translúcido por cima de qualquer cor. */
      #app-splash .app-splash-spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      /*
       * App do cliente (/app): pré-pinta a identidade visual da padaria salva
       * na última visita, ANTES de o React montar. Sem isto a tela abre no
       * verde padrão e "pisca" para a cor configurada quando a API responde.
       */
      (function () {
        try {
          if (!location.pathname.startsWith('/app')) return;
          // Mesma prioridade de src/cliente/lib/config.ts (duplicado de
          // propósito: esse script roda ANTES do bundle React, não pode
          // importar dali). Um deploy só atende várias padarias — precisa
          // saber qual empresa é a "atual" ANTES de decidir se confia no
          // cache de tema salvo, senão o dispositivo de quem já testou mais
          // de uma padaria (ou um cliente de verdade com conta em mais de
          // uma) herdaria a marca errada.
          var empresaIdAtual = null;
          try {
            var daUrl = new URLSearchParams(location.search).get('empresa');
            if (daUrl) {
              localStorage.setItem('fidelidade_cliente_empresa_id', daUrl);
              empresaIdAtual = daUrl;
            } else {
              empresaIdAtual = localStorage.getItem('fidelidade_cliente_empresa_id');
            }
          } catch (e) {}
          if (!empresaIdAtual) empresaIdAtual = '%VITE_EMPRESA_ID%' || null;

          // A aba do navegador no app do cliente usa a logo da padaria, não o
          // ícone genérico do Fideliza+ (esse continua servindo o painel em /).
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = '%VITE_EMPRESA_LOGO_URL%';
            favicon.removeAttribute('type');
          }
          var t = JSON.parse(localStorage.getItem('fidelidade_cliente_tema') || 'null');
          // Só confia no cache se ele foi salvo para a MESMA empresa que este
          // dispositivo está resolvendo agora.
          if (t && (!empresaIdAtual || t.empresaId !== empresaIdAtual)) t = null;
          if (!t) return;
          var s = document.documentElement.style;
          if (t.brand) s.setProperty('--brand', t.brand);
          if (t.contrast) s.setProperty('--brand-contrast', t.contrast);
          if (t.brand2) s.setProperty('--brand-2', t.brand2);
          if (t.canvas) s.setProperty('--color-canvas', t.canvas);
          if (t.brand) s.setProperty('--splash-bg', t.brand);
          if (t.brand2) s.setProperty('--splash-bg-2', t.brand2);
          // theme-color fica preto fixo de propósito — ver comentário na tag
          // no <head>. Não trocar por padaria aqui.
        } catch (e) {}
      })();
    </script>
    <!-- App do cliente (PWA) no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meus Pontos" />
    <link rel="apple-touch-icon" href="%VITE_EMPRESA_LOGO_URL%" />
    <title>Fideliza+</title>
  </head>
  <body>
    <div id="app-splash">
      <div class="app-splash-spinner" aria-hidden="true"></div>
    </div>
    <script>
      // Roda antes do bundle React (script deferred/module) — cobre o
      // intervalo entre o HTML pintar e o React montar de verdade. O fundo
      // (cor da marca) já vem do CSS acima; aqui só falta mostrar a splash.
      (function () {
        try {
          if (!location.pathname.startsWith('/app')) return;
          document.getElementById('app-splash').style.display = 'flex';
          window.__splashShownAt = Date.now();
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
