# Cabeçalhos de segurança básicos. De propósito SEM Content-Security-Policy
# aqui: o index.html depende de <script> inline (splash anti-flash, ver
# comentários no próprio arquivo) e a logo de cada padaria pode vir de
# qualquer domínio de imagem — uma CSP mal calibrada quebraria isso. Se for
# adicionar CSP no futuro, testar com calma (nonce pros scripts inline, img-src
# amplo o bastante pras logos das padarias).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): o balcão usa a câmera pra escanear QR do cliente
# (ver src/components/shared/qr-scanner.tsx) — não pode bloquear.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
