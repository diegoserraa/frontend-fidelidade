server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Nota: um `location` que define seu próprio add_header PERDE os herdados
    # do bloco server (inclusive os de security-headers.conf) — por isso cada
    # bloco abaixo reinclui o arquivo explicitamente.

    # Nunca cachear o HTML raiz: ele resolve a padaria/marca em runtime pela
    # URL (?empresa=) ou localStorage — um index.html velho preso no cache do
    # navegador pode travar splash/branding desatualizados num deploy que
    # atende várias padarias (ver src/cliente/lib/config.ts).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Service worker: nunca cachear, senão o cliente nunca recebe atualizações
    # (o próprio vite-plugin-pwa já versiona o conteúdo internamente).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome (Vite) podem cachear pesado — o nome muda a
    # cada build, não tem risco de servir uma versão velha por engano.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer rota que não seja um arquivo estático de verdade cai no
    # index.html — o React Router decide o resto no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
